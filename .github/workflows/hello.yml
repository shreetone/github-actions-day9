name: Hello GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI test
        run: ./test.sh

      - name: Show files
        run: ls -la

      - name: Say Hello
        run: echo "Hello from GitHub Actions!"
