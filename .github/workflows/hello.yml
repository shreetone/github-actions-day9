name: Hello GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI test
        run: ./test.sh

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Build message
        run: echo "Build completed successfully!"   
